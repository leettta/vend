{% extends "base.html" %}
{% block title %}시스템 및 입금 계좌 설정{% endblock %}

{% block content %}
<h4 class="fw-bold mb-4"><i class="fa-solid fa-gear me-2 text-primary"></i>시스템 및 입금 계좌 설정</h4>

<div class="card bg-secondary-dark border-secondary" style="max-width: 600px;">
    <div class="card-header bg-transparent border-secondary fw-bold">
        사용자 충전 안내 계좌 정보
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">입금 은행</label>
                <input type="text" name="bank_name" class="form-control bg-dark text-light border-secondary" value="{{ settings.get('bank_name', '') }}" placeholder="예: 토스뱅크, 국민은행" required>
            </div>
            <div class="mb-3">
                <label class="form-label">계좌 번호</label>
                <input type="text" name="bank_account" class="form-control bg-dark text-light border-secondary" value="{{ settings.get('bank_account', '') }}" placeholder="예: 1000-1234-5678" required>
            </div>
            <div class="mb-4">
                <label class="form-label">예금주</label>
                <input type="text" name="bank_holder" class="form-control bg-dark text-light border-secondary" value="{{ settings.get('bank_holder', '') }}" placeholder="예: 홍길동" required>
            </div>
            <button type="submit" class="btn btn-primary px-4 fw-bold">저장하기</button>
        </form>
    </div>
</div>
{% endblock %}
